name: Run automatoes tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.13.1'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up peeble
        run: |
          export GOPATH=~/go
          ./scripts/install_pebble.sh
      - name: Install dependencies
        run: |
          pip install -r requirements/development.txt
      - name: Run python unit tests
        run: |
          PYTHONPATH=$PYTHONPATH:. python tests/runtests.py
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: Build and test Rust backend
        run: |
          pip install maturin
          maturin build --release
          pip install target/wheels/rust_backend-*-cp$(echo "${{ matrix.python-version }}" | tr -d '.')-*.whl
          PYTHONPATH=$PYTHONPATH:. python tests/runrusttests.py
      - name: Run python integration tests
        run: |
          export GOPATH=~/go
          ./scripts/pebble_service.sh start tests/conf/pebble-config.json
          behave tests/features
      - name: Build packages
        run: |
          ./scripts/build.sh
