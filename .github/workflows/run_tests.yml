name: Run automatoes tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.13.1'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up peeble
        run: |
          export GOPATH=~/go
          ./scripts/install_pebble.sh
      - name: Install dependencies
        run: |
          pip install -r requirements/development.txt
      - name: Run python unit tests
        run: |
          PYTHONPATH=$PYTHONPATH:. python tests/runtests.py
      - name: Build and test Rust backend
        run: |
          maturin develop --release
          PYTHONPATH=$PYTHONPATH:. python tests/runrusttests.py
      - name: Run python integration tests
        run: |
          export GOPATH=~/go
          ./scripts/pebble_service.sh start tests/conf/pebble-config.json
          PYTHONPATH=$PYTHONPATH:. python tests/runintegrationtests.py
      - name: Build packages
        run: |
          ./scripts/build.sh
