name: Run automatoes tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.13.1'
          cache: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Set up Pebble
        run: |
          export GOPATH=~/go
          ./scripts/install_pebble.sh
      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras
      - name: Run Python unit tests
        run: |
          uv run python tests/runtests.py
      - name: Run Rust backend tests
        run: |
          uv run python tests/runrusttests.py
      - name: Run Python integration tests
        run: |
          export GOPATH=~/go
          ./scripts/pebble_service.sh start tests/conf/pebble-config.json
          uv run python tests/runintegrationtests.py
      - name: Build packages
        run: |
          ./scripts/build.sh
