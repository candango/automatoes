name: Run automatoes tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.13.1'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up peeble
        run: |
          export GOPATH=~/go
          ./scripts/install_pebble.sh
      - name: Install dependencies
        run: |
          pip install -r requirements/development.txt
      - name: Run python unit tests
        run: |
          PYTHONPATH=$PYTHONPATH:. python tests/runtests.py
      - name: Run python behave tests
        run: |
          export GOPATH=~/go
          ./scripts/pebble_service.sh start tests/conf/pebble-config.json
          behave tests/features
      - name: Lint
        run: |
          pip install ruff
          ruff check automatoes --output-format json > ruff.json || true
          jq -r '
            .[] |
            if (.filename != null and .location != null) then
              "TEST:error file=\(.filename),line=\(.location.row),col=\(.location.column)" +
              (if .end_location != null then
                ",endLine=\(.end_location.row),endColumn=\(.end_location.column)"
              else "" end) +
              "::[\(.code // "RUFF")] \(.message)"
                  else
              "TEST:error::[\(.code // "RUFF")] \(.message)"
            end
          ' ruff.json
      - name: Build packages
        run: |
          ./scripts/build.sh
